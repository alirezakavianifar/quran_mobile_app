name: Android APK Build & Distribution Pipeline

on:
  workflow_dispatch:
    inputs:
      abi:
        description: 'Target Architecture (ABI)'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - arm64-v8a
          - universal
          - all
      target_url:
        description: 'Backend Target API URL'
        required: true
        default: 'http://localhost:5000'
        type: string
      send_to_rubika:
        description: 'Send packaged build to Rubika Bot'
        required: false
        default: true
        type: boolean

jobs:
  build-apk:
    name: Build Android APK (${{ inputs.abi || 'arm64-v8a' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install requests requests_toolbelt urllib3

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clean & Prepare Android Environment
        run: |
          cd src/quran_mobile_app
          flutter clean
          flutter pub get
        shell: bash

      - name: Compile Release APK & Package
        run: |
          cd src/quran_mobile_app
          ABI="${{ inputs.abi || 'arm64-v8a' }}"
          API_URL="${{ inputs.target_url || 'http://localhost:5000' }}"
          
          echo "Building Quran Mobile App release APK (ABI: $ABI) with API: $API_URL"
          
          BUILD_ARGS=(
            "build" "apk"
            "--release"
            "--dart-define=API_BASE_URL=$API_URL"
            "--no-tree-shake-icons"
          )
          
          if [ "$ABI" = "arm64-v8a" ]; then
            BUILD_ARGS+=("--split-per-abi" "--target-platform" "android-arm64")
          elif [ "$ABI" = "all" ]; then
            BUILD_ARGS+=("--split-per-abi")
          fi
          
          flutter "${BUILD_ARGS[@]}"
          
          APK_DIR="build/app/outputs/flutter-apk"
          PRIMARY_APK=""
          
          if [ "$ABI" = "arm64-v8a" ]; then
            for candidate in \
              "$APK_DIR/app-arm64-v8a-release.apk" \
              "$APK_DIR/app-release.apk"; do
              if [ -f "$candidate" ]; then
                PRIMARY_APK="$candidate"
                break
              fi
            done
          elif [ "$ABI" = "universal" ]; then
            for candidate in \
              "$APK_DIR/app-release.apk"; do
              if [ -f "$candidate" ]; then
                PRIMARY_APK="$candidate"
                break
              fi
            done
          elif [ "$ABI" = "all" ]; then
            cp "$APK_DIR"/*.apk "${GITHUB_WORKSPACE}/" 2>/dev/null || true
            PRIMARY_APK=$(ls "$APK_DIR"/*arm64*.apk 2>/dev/null | head -n 1)
            if [ -z "$PRIMARY_APK" ]; then
              PRIMARY_APK=$(ls "$APK_DIR"/*.apk 2>/dev/null | head -n 1)
            fi
          fi
          
          if [ -z "$PRIMARY_APK" ] || [ ! -f "$PRIMARY_APK" ]; then
            PRIMARY_APK=$(ls "$APK_DIR"/*.apk 2>/dev/null | head -n 1)
          fi
          
          if [ -f "$PRIMARY_APK" ]; then
            echo "Found compiled APK: $PRIMARY_APK"
            cp "$PRIMARY_APK" "${GITHUB_WORKSPACE}/app-release.apk"
            if [ "$ABI" = "arm64-v8a" ]; then
              cp "$PRIMARY_APK" "${GITHUB_WORKSPACE}/app-arm64-v8a-release.apk"
            fi
            
            cd "${GITHUB_WORKSPACE}"
            zip -j "app-release.zip" "app-release.apk"
            echo "Created archive: app-release.zip"
            ls -lh app-*
          else
            echo "Error: No APK file was generated!"
            exit 1
          fi
        shell: bash

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quran-android-build-${{ inputs.abi || 'arm64-v8a' }}
          path: |
            app-*-release.apk
            app-release.apk
            app-release.zip
          retention-days: 14

      - name: Send to Rubika Bot
        if: ${{ (github.event_name == 'push' || inputs.send_to_rubika != false) && success() }}
        continue-on-error: true
        env:
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN || 'CBGADB0AFGZDLMGWVNLANQKRQDWYEONKZZUGWWHCFZVZDUUFQYKAVHKZMABOOHXL' }}
        run: |
          ZIP_FILE="app-release.zip"
          if [ -f "$ZIP_FILE" ]; then
            echo "Sending $ZIP_FILE to Rubika Bot..."
            python3 scripts/upload-to-rubika.py --file "$ZIP_FILE"
          elif [ -f "app-release.apk" ]; then
            echo "Sending APK to Rubika Bot..."
            python3 scripts/upload-to-rubika.py --file "app-release.apk"
          fi
        shell: bash
