name: Quran Platform CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Build & Test ASP.NET Core Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: quran_admin
          POSTGRES_PASSWORD: quran_pass
          POSTGRES_DB: quran_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python (for DB seeding)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Initialize PostgreSQL Schema & Seed Data
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: quran_db
          POSTGRES_USER: quran_admin
          POSTGRES_PASSWORD: quran_pass
          PGPASSWORD: quran_pass
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -p 5432 -U quran_admin -d quran_db -f sql/schema_phase1.sql
          python -m pip install psycopg2-binary
          python scripts/ingestion/seed_postgres.py
        shell: bash

      - name: Restore Dependencies
        run: dotnet restore QuaranPlatform.slnx

      - name: Build Solution
        run: dotnet build QuaranPlatform.slnx --configuration Release --no-restore

      - name: Execute .NET Test Suites
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=quran_db;Username=quran_admin;Password=quran_pass"
        run: dotnet test QuaranPlatform.slnx --configuration Release --no-build --verbosity normal

  data-nlp-test:
    name: Test Data Ingestion & NLP Engine
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: quran_admin
          POSTGRES_PASSWORD: quran_pass
          POSTGRES_DB: quran_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python (3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies & Seed Database
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: quran_db
          POSTGRES_USER: quran_admin
          POSTGRES_PASSWORD: quran_pass
          PGPASSWORD: quran_pass
        run: |
          python -m pip install --upgrade pip
          pip install pytest psycopg2-binary
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -p 5432 -U quran_admin -d quran_db -f sql/schema_phase1.sql
          python scripts/ingestion/seed_postgres.py
        shell: bash

      - name: Execute Python Tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: quran_db
          POSTGRES_USER: quran_admin
          POSTGRES_PASSWORD: quran_pass
        run: pytest tests/test_phase0_data.py tests/test_phase1_postgres.py

  flutter-app-test:
    name: Build & Test Flutter Mobile & Web App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter Pub Get
        run: flutter pub get
        working-directory: src/quran_mobile_app

      - name: Run Flutter Tests
        run: flutter test
        working-directory: src/quran_mobile_app
